# Automatic Claude code review on every pull request.
#
# Based on the official examples in anthropics/claude-code-action
# (pr-review-comprehensive.yml). The action is pinned to a commit because
# this job can read the API key secret.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait until ready; fork PRs never get the secret; bot-triggered
    # runs are skipped because the action refuses
    # non-human actors and the code-review command skips automated PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action asks for a write token by default (contents, issues,
          # pull_requests). A review only needs to post PR comments, so
          # narrow contents and issues to read.
          additional_permissions: |
            contents: read
            issues: read
          # A direct prompt, not the code-review plugin: the plugin stops on
          # any PR where claude[bot] already commented, and the claude.ai
          # review bot posts as claude[bot] too, so every PR would be skipped
          # and later pushes would never be re-reviewed.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request at its current head. Read CONTRIBUTING.md (generated files are not edited here; adapters build on the shared triad) first
            and hold the change to it.

            1. Read the diff (`gh pr diff`) and the PR description
               (`gh pr view`). Read the files you need from the checkout.
            2. Read the existing inline review comments
               (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`).
               Do not repeat an issue that is already raised there.
            3. Look for real defects: wrong behaviour, security problems
               (secrets, auth, injection, anything that fails open), broken
               error handling, missing tests for changed behaviour, and
               breaks of the rules in CONTRIBUTING.md (generated files are not edited here; adapters build on the shared triad). Skip style nits and anything a
               linter or type checker would catch.
            4. For each defect, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` and
               `confirmed: true`. Start it with a severity: **blocking** or
               **non-blocking**. Say what goes wrong, with a concrete
               input or path, and the smallest fix.
            5. Post one short summary with `gh pr comment`, naming the head
               SHA you reviewed and the number of issues by severity. If you
               found nothing, say so in one line.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Read,Glob,Grep"
