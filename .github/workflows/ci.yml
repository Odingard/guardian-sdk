name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Setup file (skill.md) matches the packages
        run: |
          node scripts/check-skill.mjs
          node --test scripts/check-skill.test.mjs
      - name: SDK types check in a TypeScript 5 project (skipLibCheck off)
        run: node scripts/check-sdk-types.mjs
      - name: Examples run (local demo policy)
        working-directory: examples
        run: |
          for f in demo-classes prompt-injection-deny coding-agent-ask shopping-agent payments/steel-checkout payments/invoice-agent agents/mastra-agent; do
            node "$f.mjs" > /dev/null
          done

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Microsoft Agent Framework and Semantic Kernel (Python 3.11+)
        if: matrix.python-version == '3.13'
        run: pip install "agent-framework-core==1.26.0" "semantic-kernel==1.47.0"
      - name: LangChain and LangGraph (Python 3.11+)
        if: matrix.python-version == '3.13'
        run: pip install "langchain==1.5.2" "langchain-core==1.8.4" "langgraph==1.2.24"
      - name: OpenAI Agents SDK (Python 3.10+)
        if: matrix.python-version == '3.13'
        run: pip install "openai-agents==0.25.0"
      - run: python -m pytest -q
      - name: Build and check Python distributions
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install build
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m build
          python scripts/check-dist.py
      - name: Python example runs (local demo policy)
        run: python ../../examples/python/invoice_agent.py > /dev/null
      - name: Python LangChain example runs (local demo policy)
        if: matrix.python-version == '3.13'
        run: python ../../examples/python/langchain_agent.py > /dev/null
      - name: OpenAI Agents SDK example runs (scripted model, local demo policy)
        if: matrix.python-version == '3.13'
        run: python ../../examples/python/openai_agents_agent.py > /dev/null
      # crewAI 1.15.44 requires openai<3 and the OpenAI Agents SDK pin requires a newer openai, so crewAI is installed and tested in its own environment.
      - name: crewAI in its own environment (Python 3.10 to 3.13)
        if: matrix.python-version == '3.13'
        run: |
          python -m venv .venv-crewai
          .venv-crewai/bin/python -m pip install -e ".[test]" "crewai==1.15.44"
          .venv-crewai/bin/python -m pip check
          .venv-crewai/bin/python -m pytest -q tests/test_crewai.py
          .venv-crewai/bin/python ../../examples/python/crewai_agent.py > /dev/null
