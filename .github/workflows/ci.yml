name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Examples run (local demo policy)
        working-directory: examples
        run: |
          for f in demo-classes prompt-injection-deny coding-agent-ask shopping-agent steel-checkout invoice-agent; do
            node "$f.mjs" > /dev/null
          done

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Python example runs (local demo policy)
        run: python ../../examples/python/invoice_agent.py > /dev/null
